name: Paper trading session

# Runs the paper-trading session after each US market close (M-F).
on:
  schedule:
    - cron: "30 21 * * 1-5"
      # the forward log must draft at every close: crypto clock
      # entries happen on weekends too, and a row exists only at
      # the cross - a missed weekend cross is a lost row forever
    - cron: "30 21 * * 6,7"
  workflow_dispatch:

concurrency:
  group: paper-trading
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy yfinance pypdf

      - name: Fetch daily bars
        run: python3 strategy/fetch_data.py --data-dir ./paper/data --tickers SPY,QQQ,IWM,XLF,XLE

      - name: Run paper-trading session
        run: python3 strategy/papertrading_runner.py --data-dir ./paper/data --state-dir ./paper/state --report | tee ./paper/session_report.txt

      - name: Generate session performance report
        run: python3 strategy/session_report.py --data-dir ./paper/data --state-dir ./paper/state --markdown ./paper/performance_report.md

      - name: Evaluate promotion gate
        run: python3 strategy/gate_check.py --data-dir ./paper/data --state-dir ./paper/state --markdown ./paper/gate_verdict.md

      - name: Edge-seeker research pass
        run: python3 strategy/edge_seeker.py --data-dir ./paper/data --markdown ./paper/edge_report.md

      - name: Cross-asset edge research (crypto, indices, commodities)
        run: python3 strategy/cross_asset.py --research-dir ./paper/research --markdown ./paper/research/cross_asset_report.md

      - name: AVFI v3 risk-throttle research + iteration
        run: python3 strategy/avfi.py --data-dir ./paper/data --research-dir ./paper/research --markdown ./paper/research/avfi_report.md

      - name: Tops-and-bottoms detector study
        run: python3 strategy/tops_bottoms.py --data-dir ./paper/data --research-dir ./paper/research

      - name: Challenger shadow session + race report
        run: python3 strategy/challenger.py --data-dir ./paper/data --champion-state ./paper/state --challenger-state ./paper/challenger --markdown ./paper/challenger_report.md

      - name: Automated redeployment proposal (if challenger wins)
        run: python3 strategy/propose_redeploy.py --report ./paper/challenger_report.md --apply

      - name: Update session journal
        run: python3 strategy/journal.py --data-dir ./paper/data --state-dir ./paper/state --journal ./paper/journal.md

      - name: Ingest research PDFs (articles path)
        run: python3 strategy/pdf_ingest.py --repo-root . --research-dir ./paper/research

      - name: Synthesize lessons and inferences from all data
        run: python3 strategy/lessons.py --paper-dir ./paper

      - name: MR-coin edge study (with control group)
        run: python3 strategy/mr_edge.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: v4 confirmation-premium study (vs plain, whole universe)
        run: python3 strategy/v4_study.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: Commodity edge through the full honesty battery
        run: python3 strategy/commodity_edge.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: Structural inevitabilities study
        run: python3 strategy/inevitabilities.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH proof battery
        run: python3 strategy/smh_proof.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH hazard model (KM + Cox)
        run: python3 strategy/smh_hazard.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH salience gradient + event anatomy (charter ticks 5 and 6)
        run: python3 strategy/smh_gradient.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: AVFI precursor battery (incremental information beyond the clock)
        run: python3 strategy/avfi_precursor.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH forward scoring protocol (draft, resolve, score, kill lines)
        run: python3 strategy/smh_forward.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH judgment log pass (the human inside the protocol)
        run: python3 strategy/smh_judgment.py --research-dir ./paper/research

      - name: SMH Bayesian forecaster pass (the blend, open problem 5)
        run: python3 strategy/smh_bayes.py --research-dir ./paper/research

      - name: Trade inevitables (the rule additions, Layer 5)
        run: python3 strategy/trade_inevitables.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: The market philosopher (longs from measured rules)
        run: python3 strategy/market_philosopher.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: The timing battery (the WHEN prediction)
        run: python3 strategy/timing_battery.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: The exit battery (entry exits, fewer trades)
        run: python3 strategy/exit_battery.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: Law-4 battery (effort vs result at the entry)
        run: python3 strategy/law4_battery.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: The short mirror (is the long-only philosophy a measurement?)
        run: python3 strategy/short_mirror.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: Full-universe tops/bottoms backtest (v4 detection + the long rule)
        run: python3 strategy/tops_bottoms_backtest.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: V4 chart pages + portfolio equity (the universe, marked)
        run: python3 strategy/v4_charts.py --data-dir ./paper/research/data --research-dir ./paper/research --docs-dir ./docs

      - name: SMH precursor signature battery (open problem 3)
        run: python3 strategy/smh_precursor.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH machine live position (status reading)
        run: python3 strategy/smh_status.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH conditional direction battery (law 3's cells)
        run: python3 strategy/smh_direction.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH recurrence battery (the long-run lemma)
        run: python3 strategy/smh_recurrence.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: SMH temporal calibration battery (the forward log's dress rehearsal)
        run: python3 strategy/smh_calibration.py --data-dir ./paper/research/data --research-dir ./paper/research

      - name: Publish uploaded research pages
        run: |
          shopt -s nullglob
          for f in *.html; do
            [ "$f" = "dashboard.html" ] && continue
            cp "$f" docs/
            echo "published $f -> docs/"
          done

      - name: Regenerate dashboard
        run: python3 strategy/dashboard.py --paper-dir ./paper --out ./dashboard.html --markdown ./DASHBOARD.md --site ./docs/instrument.html


      - name: The thesis presentation page
        run: python3 strategy/thesis.py --paper-dir ./paper --docs-dir ./docs

      - name: File incident alerts (if any anomalies)
        run: python3 strategy/alert.py --data-dir ./paper/data --state-dir ./paper/state --create-issue

      - name: Commit session state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add paper/ dashboard.html DASHBOARD.md docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Paper-trading session $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push

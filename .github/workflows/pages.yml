name: Deploy Salient site

# Deploys docs/index.html to GitHub Pages on every change.
# One-time setup (repo owner): Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", "paper/**", "strategy/dashboard.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate site from latest artifacts
        run: |
          pip install numpy
          python3 strategy/dashboard.py --paper-dir ./paper --out ./dashboard.html --markdown ./DASHBOARD.md --site ./docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

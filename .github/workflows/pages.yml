name: Deploy Salient site

# Deploys the docs/ directory to GitHub Pages exactly as committed.
# The site is now hand-authored (index.html + falsification.html +
# infrastructure.html + knowledge.html + site.css + assets/); the deploy
# must NOT regenerate or overwrite any page. The nightly paper-trading
# workflow still regenerates dashboard.html / DASHBOARD.md and commits
# them, but docs/ is deployed verbatim.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

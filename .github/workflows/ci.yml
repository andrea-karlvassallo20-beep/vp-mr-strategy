name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy nautilus_trader
      - name: Real NautilusTrader engine suite
        run: python3 strategy/test_nautilus_engine.py
      - name: Engine parity suite (runner vs real engine, same data)
        run: python3 strategy/test_engine_parity.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas pypdf
      - name: Gate suite (G1-G4 + modules)
        run: python3 strategy/test_gates.py
      - name: Adapter wiring suite (stubbed engine)
        run: python3 strategy/test_adapter_wiring.py
      - name: Paper-trading runner suite (persistence, idempotency, SPI)
        run: python3 strategy/test_runner.py
      - name: Session report suite (state -> report consistency)
        run: python3 strategy/test_session_report.py
      - name: Promotion gate suite (PROMOTE/HOLD verdicts)
        run: python3 strategy/test_gate_check.py
      - name: Fetcher hardening suite (retries, empty frames, schema)
        run: python3 strategy/test_fetch.py
      - name: Edge-seeker suite (honest walk-forward proposals)
        run: python3 strategy/test_edge_seeker.py
      - name: Knowledge-grounded variant suite (vol models, VSA filter)
        run: python3 strategy/test_vol_models.py
      - name: Cross-asset edge research suite (crypto, indices, commodities)
        run: python3 strategy/test_cross_asset.py
      - name: AVFI replication suite (indicator math, throttle causality)
        run: python3 strategy/test_avfi.py
      - name: Tops-and-bottoms detector suite (divergence, climax, event study)
        run: python3 strategy/test_tops_bottoms.py
      - name: Dashboard suite (generation + empty-state grace)
        run: python3 strategy/test_dashboard.py
      - name: PDF ingestion suite (extraction, registry, grace)
        run: python3 strategy/test_pdf_ingest.py
      - name: Overfitting statistics suite (DSR, PBO on known ground truth)
        run: python3 strategy/test_overfit_stats.py
      - name: Lessons synthesis suite (live inference extraction)
        run: python3 strategy/test_lessons.py
      - name: MR-coin edge suite (control group, ground truth, dead-coin filter)
        run: python3 strategy/test_mr_edge.py
      - name: v4 confirmation-premium suite (causality, engineered ground truth)
        run: python3 strategy/test_v4_study.py
      - name: Commodity edge battery suite (ground truth both ways)
        run: python3 strategy/test_commodity_edge.py
      - name: Inevitabilities suite (structural ground truth)
        run: python3 strategy/test_inevitabilities.py
      - name: Nightly pre-flight (full session simulation)
        run: python3 strategy/test_nightly_preflight.py
      - name: Session journal suite
        run: python3 strategy/test_journal.py
      - name: Challenger suite (champion/challenger race)
        run: python3 strategy/test_challenger.py
      - name: Auto-redeploy proposal suite
        run: python3 strategy/test_propose_redeploy.py

      - name: Incident alert suite
        run: python3 strategy/test_alert.py

      - name: Feed contract check (synthetic fetch -> runner consumption)
        run: |
          python3 strategy/fetch_data.py --data-dir /tmp/feeddata --synthetic --bars 120 --tickers SPY,QQQ
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "strategy")
          from papertrading_runner import load_bars
          from pathlib import Path
          for f in Path("/tmp/feeddata").glob("*.csv"):
              bars = load_bars(f)
              assert len(bars) == 120, f
              dates = [b["date"] for b in bars]
              assert dates == sorted(dates), f"dates not monotonic: {f}"
              assert all(b["close"] > 0 for b in bars), f
              print(f"{f.name}: 120 bars, monotonic dates, valid closes")
          PY

      - name: Smoke validation (SPI + determinism)
        run: |
          python3 strategy/vp_mr_strategy.py
          A=$(python3 strategy/vp_mr_strategy.py | md5sum)
          B=$(python3 strategy/vp_mr_strategy.py | md5sum)
          [ "$A" = "$B" ] && echo "deterministic: OK" || { echo "non-deterministic"; exit 1; }
      - name: Run card generation consistency
        run: |
          python3 strategy/generate_run_card.py > /dev/null
          git diff --exit-code strategy/run_card.json

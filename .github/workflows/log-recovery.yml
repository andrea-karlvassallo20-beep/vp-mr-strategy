name: Log recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: log-recovery-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  land:
    if: startsWith(github.head_ref, 'log-repair-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Decode session payloads (gz+base64) and byte-verify
        run: |
          set -euo pipefail
          MANIFEST=.log-repair/payloads/manifest.json
          if [ ! -f "$MANIFEST" ]; then
            echo "No payloads dir on this head. Nothing to decode. No-op."
            exit 0
          fi
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path(".")
          man = json.loads((root / ".log-repair/payloads/manifest.json").read_text())
          for src, meta in man["files"].items():
              b64 = (root / src).read_bytes().strip()
              gz = base64.b64decode(b64, validate=True)
              assert hashlib.sha256(gz).hexdigest() == meta["gz_sha256"], f"gz sha mismatch: {src}"
              data = gzip.decompress(gz)
              n = meta["orig_bytes"]
              assert len(data) == n, f"size mismatch: {src}"
              assert hashlib.sha256(data).hexdigest() == meta["orig_sha256"], f"sha mismatch: {src}"
              target = root / meta["target"]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"decoded {src} -> {meta['target']} ({n} bytes, sha verified)")
          PY
          git rm -r --quiet .log-repair/payloads
          echo "payloads decoded and staged for one landing commit"

      - name: Restore programme log and append session entries
        run: |
          set -euo pipefail
          LOG=paper/research/null_time_programme.md
          APPEND=.log-repair/append_2026-11-20.md
          STATE=.log-repair/state.log
          MARKER="APPLIED append_2026-11-20"

          if [ -f "$STATE" ] && grep -qF "$MARKER" "$STATE"; then
            echo "Repair already applied (state marker present). No-op."
            exit 0
          fi
          if [ ! -f "$APPEND" ]; then
            echo "Append file $APPEND absent on this head. Nothing to apply. No-op."
            exit 0
          fi

          OLD_SIZE=$(git cat-file -s "$(git rev-parse "HEAD:$LOG")" 2>/dev/null || echo 0)
          TARGET=450430
          echo "Current tree log size: $OLD_SIZE bytes"

          CAND=""
          for c in $(git rev-list --all -- "$LOG"); do
            blob=$(git rev-parse "$c:$LOG" 2>/dev/null || continue)
            sz=$(git cat-file -s "$blob" 2>/dev/null || echo 0)
            if [ "$sz" -eq "$TARGET" ]; then
              CAND="$c"
              echo "Intact log blob found at commit $c ($sz bytes)"
              break
            fi
          done
          if [ -z "$CAND" ]; then
            echo "FATAL: no intact parent blob of $LOG found in git history." >&2
            exit 1
          fi
          git show "$CAND:$LOG" > /tmp/restored.log

          RESTORED_SIZE=$(stat -c%s /tmp/restored.log)
          APPEND_SIZE=$(stat -c%s "$APPEND")
          if [ "$RESTORED_SIZE" -le "$OLD_SIZE" ]; then
            echo "FATAL: restored core ($RESTORED_SIZE) must exceed current corrupted size ($OLD_SIZE)." >&2
            exit 1
          fi

          cat /tmp/restored.log "$APPEND" > "$LOG"
          NEW_SIZE=$(stat -c%s "$LOG")
          if [ "$NEW_SIZE" -le "$RESTORED_SIZE" ]; then
            echo "FATAL: assembled log ($NEW_SIZE) must exceed restored core ($RESTORED_SIZE)." >&2
            exit 1
          fi
          echo "Assembled log: $NEW_SIZE bytes"

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("paper/research/null_time_programme.md")
          raw = p.read_bytes()
          raw.decode("utf-8", errors="strict")
          txt = raw.decode("utf-8")
          bad = [l for l in txt.splitlines() if any(ord(ch) < 32 and ch != "\t" for ch in l)]
          assert not bad, f"control-character lines found: {bad[:3]}"
          for marker in ("<<<<<<<", "=======", ">>>>>>>"):
              assert marker not in txt, f"conflict marker {marker} present"
          hdrs = re.findall(r"^## (\d+)\. ", txt, flags=re.M)
          nums = [int(h) for h in hdrs]
          assert nums == sorted(nums), "entry headers out of numeric order"
          assert len(nums) == len(set(nums)), "duplicate entry headers"
          assert max(nums) == 77, f"expected the repaired log to run through entry 77, last is {max(nums)}"
          for want in (73, 74, 75, 76, 77):
              assert nums.count(want) == 1, f"entry ## {want}: expected exactly 1 header, found {nums.count(want)}"
          print("programme log hygiene gates passed")
          PY

          echo "$MARKER" >> "$STATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG" "$STATE"
          git commit -m "log-repair + session payloads: restore intact log entries ## 21-## 73 from the pre-corruption parent, land entry ## 74 reconstructed from the PR #250 squash-commit message and entries ## 75-## 77 (repair corrigendum, edition-4 synthesis pass, deep-read 60), and decode the session's document payloads byte-verified against the manifest. Guard clean. Nothing measured, no kill line moved, nothing armed, nothing trades live."
          git push origin HEAD:${{ github.head_ref }}

name: Log restore 72

# Decodes the .log-repair-72/ payload segments, verifies the sha256 against
# .log-repair-72/manifest.json, restores the append-only programme log,
# then removes the payloads and the truncated-write scaffold. Mirrors the
# recovery mechanism of log ## 75 (session 71): single-call writes of the
# log truncate at ~64K; payloads under the ceiling are the verified path.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: log-restore-72
  cancel-in-progress: false

jobs:
  restore:
    if: github.event.pull_request.head.ref == 'vibe/null-time-72-deepread-61-x973a89'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Decode, verify, restore
        run: |
          set -eu
          python3 - <<'PY'
          import base64, glob, gzip, hashlib, json, os, sys
          man = json.load(open('.log-repair-72/manifest.json'))
          segs = [open(p).read() for p in sorted(glob.glob('.log-repair-72/segment_*.b64'))]
          assert len(segs) == man['segments'], f"segment count {len(segs)} != {man['segments']}"
          data = gzip.decompress(base64.b64decode(''.join(segs)))
          assert len(data) == man['raw_bytes'], f"raw bytes {len(data)} != {man['raw_bytes']}"
          h = hashlib.sha256(data).hexdigest()
          assert h == man['sha256'], f"sha256 mismatch {h} != {man['sha256']}"
          with open(man['target'], 'wb') as f:
              f.write(data)
          print(f"restored {man['target']}: {len(data)} bytes, sha256 {h}")
          PY
          git rm -r --quiet .log-repair-72
          git rm --quiet .github/workflows/log_restore_72.yml || true

      - name: Commit restoration
        run: |
          git config user.name "log-restore-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Log restore 72: decode verified payloads (4 segments, sha256-checked), append-only programme log restored to 481148 bytes with entries ## 78 and ## 79; payloads and scaffold removed. GITHUB_TOKEN pushes do not trigger CI; the following session commit retriggers it. Guard clean. Nothing measured, no kill line moved, nothing armed, nothing trades live."
          git push
